<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <title>Deimos Build Cost</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/apexnova08/fish.css@main/lite.css">

    <style>
        .positive {
            color: limegreen;
        }

        .negative {
            color: tomato;
        }
    </style>
    <script src="dascript.js" defer></script>
</head>

<body>

<h1>Deimos Manufacturing Cost</h1>

<label>
    Material Efficiency (%)

    <input
        id="meInput"
        type="number"
        value="10"
        min="0"
        max="10"
    >
</label>

<br><br>

<button onclick="load()">
    Load Prices
</button>

<p id="status"></p>

<table id="table" hidden>
    <thead>
        <tr>
            <th>Material</th>
            <th>Base Qty</th>
            <th>ME Qty</th>
            <th>Jita 4-4 Sell</th>
            <th>Total</th>
        </tr>
    </thead>

    <tbody></tbody>
</table>

<h2 id="grandTotal"></h2>

</body>
</html>
